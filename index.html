<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>IWC Team</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23161615'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Sign in -->
  <main id="signin" class="signin" hidden>
    <form id="signin-form" class="signin-card" autocomplete="on">
      <h1>IWC Team</h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <p class="form-error" id="signin-error" role="alert"></p>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap top-row">
        <strong class="brand">IWC Team</strong>
        <span class="muted" id="today"></span>
        <span class="spacer"></span>
        <span id="me" class="muted"></span>
        <button class="link" id="signout" type="button">Sign out</button>
      </div>
    </header>

    <main class="wrap">
      <section aria-labelledby="tasks-h">
        <h2 id="tasks-h" class="section-h">Tasks</h2>
        <div id="board" class="board"></div>
      </section>

      <section aria-labelledby="an-h" class="analytics">
        <div class="section-row">
          <h2 id="an-h" class="section-h">Analytics</h2>
          <div class="seg" role="group" aria-label="Period" id="period">
            <button type="button" data-days="7">7 days</button>
            <button type="button" data-days="30" aria-pressed="true">30 days</button>
            <button type="button" data-days="90">90 days</button>
          </div>
        </div>
        <div id="analytics"><p class="muted">Loading…</p></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
