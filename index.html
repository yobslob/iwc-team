<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <meta name="robots" content="noindex, nofollow">
  <title>IWC Team</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237a2e23'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme (or the system's) before the page paints, so it never flashes.
    try {
      var t = localStorage.getItem("iwc-team-theme");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Karla:wght@400;500;600;700&family=Syne:wght@600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Sign in -->
  <main id="signin" class="signin" hidden>
    <form id="signin-form" class="signin-card" autocomplete="on">
      <h1 class="mark">IWC <small>Team</small></h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <p class="form-error" id="signin-error" role="alert"></p>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap top-row">
        <span class="mark">IWC <small>Team</small></span>
        <span class="spacer"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark theme" title="Theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span id="me" class="muted"></span>
        <button class="link" id="signout" type="button">Sign out</button>
      </div>
    </header>

    <main class="wrap">
      <section aria-labelledby="hello-h">
        <div class="hello">
          <h1 id="hello-h"></h1>
          <p id="today"></p>
        </div>
        <div id="board" class="board"></div>
      </section>

      <section aria-labelledby="an-h" class="analytics">
        <div class="section-row">
          <h2 id="an-h" class="section-h">Analytics</h2>
          <div class="seg" role="group" aria-label="Period" id="period">
            <button type="button" data-days="7">7 days</button>
            <button type="button" data-days="30" aria-pressed="true">30 days</button>
            <button type="button" data-days="90">90 days</button>
          </div>
        </div>
        <div id="analytics"><p class="muted">Loading…</p></div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
